name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: zoo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Reads every ZIP's frontmatter and refuses on a missing field, a status
      # outside the vocabulary, a number that disagrees with its filename, a
      # duplicate number, a requires: that names a ZIP which does not exist, or
      # a corpus that has shrunk. Then checks the README table still matches.
      - name: Index
        run: python3 scripts/index.py --check

  site:
    runs-on: zoo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm build
